<!DOCTYPE html>
<html lang="en" data-theme="observatory">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Presentations · Hackley STEM Club</title>
    <meta
      name="description"
      content="Featured and archived Hackley STEM Club presentations."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script src="js/theme.js"></script>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body data-page="presentations">
    <header class="site-header">
      <div class="nav-wrap">
        <a class="brand" href="index.html"><span id="club-name">Hackley STEM Club</span></a>
        <nav class="nav" aria-label="Primary">
          <a href="index.html" data-nav="home">Home</a>
          <a href="calendar.html" data-nav="calendar">Calendar</a>
          <a href="events.html" data-nav="events">Past Events</a>
          <a href="presentations.html" data-nav="presentations">Presentations</a>
          <a href="contact.html" data-nav="contact">Contact</a>
        </nav>
      </div>
    </header>

    <main>
      <header class="page-hero">
        <h1>Presentations</h1>
        <p>Past STEM Club talks.</p>
      </header>

      <section class="section" style="padding-top: 1rem">
        <div class="section-head">
          <div>
            <h2>Featured</h2>
            <p>Pinned talks from the club.</p>
          </div>
        </div>
        <div id="featured-list"></div>
      </section>

      <section class="section" style="padding-top: 0">
        <div class="section-head">
          <div>
            <h2>All presentations</h2>
            <p>Full list, newest first.</p>
          </div>
        </div>
        <div id="all-talks"></div>
      </section>
    </main>

    <footer class="site-footer">
      <span><span id="club-name-footer">Hackley STEM Club</span></span>
      <span>Day 2 · S118</span>
    </footer>

    <script src="js/content.js"></script>
    <script src="js/main.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const talks = [...(StemClub.data.presentations || [])].sort((a, b) => {
          // Dated talks first (newest), then undated archive talks
          if (a.date && b.date) return b.date.localeCompare(a.date);
          if (a.date) return -1;
          if (b.date) return 1;
          return a.title.localeCompare(b.title);
        });
        const featured = talks.filter((t) => t.featured);
        document.getElementById("featured-list").innerHTML =
          StemClub.renderFeatured(featured) ||
          '<p class="empty">No featured presentations yet.</p>';
        document.getElementById("all-talks").innerHTML = StemClub.renderTalkRows(
          talks,
          "No presentations yet."
        );
      });
    </script>
  </body>
</html>
