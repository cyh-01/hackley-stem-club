<!DOCTYPE html>
<html lang="en" data-theme="observatory">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Calendar · Hackley STEM Club</title>
    <meta name="description" content="Hackley STEM Club calendar of upcoming meetings and events." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script src="js/theme.js"></script>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body data-page="calendar">
    <header class="site-header">
      <div class="nav-wrap">
        <a class="brand" href="index.html"><span id="club-name">Hackley STEM Club</span></a>
        <nav class="nav" aria-label="Primary">
          <a href="index.html" data-nav="home">Home</a>
          <a href="calendar.html" data-nav="calendar">Calendar</a>
          <a href="events.html" data-nav="events">Past Events</a>
          <a href="presentations.html" data-nav="presentations">Presentations</a>
          <a href="contact.html" data-nav="contact">Contact</a>
        </nav>
      </div>
    </header>

    <main>
      <header class="page-hero">
        <h1>Calendar</h1>
        <p>
          Upcoming meetings and events. Click any day with a teal dot for
          details!
        </p>
      </header>

      <section class="section" style="padding-top: 1rem">
        <div id="calendar-root"></div>
      </section>

      <section class="section" style="padding-top: 0">
        <div class="section-head">
          <div>
            <h2>All upcoming</h2>
            <p>Everything scheduled from today forward.</p>
          </div>
        </div>
        <div id="upcoming-list"></div>
      </section>
    </main>

    <footer class="site-footer">
      <span><span id="club-name-footer">Hackley STEM Club</span></span>
      <span>Day 2 · S118</span>
    </footer>

    <script src="js/content.js"></script>
    <script src="js/main.js"></script>
    <script src="js/calendar.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        document.getElementById("upcoming-list").innerHTML = StemClub.renderEventRows(
          StemClub.upcomingEvents(),
          "No upcoming events yet."
        );
      });
    </script>
  </body>
</html>
